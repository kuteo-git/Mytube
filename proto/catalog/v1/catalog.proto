syntax = "proto3";

package catalog.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucnguyen/local-youtube/services/catalog/gen/catalog/v1;catalogv1";

// The catalog service owns everything that describes the local library:
// videos, channels, comments and per-user interaction state.
//
// It deliberately does NOT rank anything. Ordering a feed or an up-next rail
// is the recommendation service's job; the gateway asks recsys for ranked ids
// and hydrates them here via BatchGetVideos. Keeping ranking out of catalog is
// what stops the two services from needing each other's data.
service CatalogService {
  // Reads
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  // Hydrates ids returned by the recommendation service. Order of the request
  // is preserved in the response so ranking survives the round trip.
  rpc BatchGetVideos(BatchGetVideosRequest) returns (BatchGetVideosResponse);
  rpc SearchVideos(SearchVideosRequest) returns (SearchVideosResponse);
  // Type-ahead over the local library only. Suggesting terms the library
  // cannot answer would lead every one of them to an empty result page.
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc ListChannelVideos(ListChannelVideosRequest) returns (ListChannelVideosResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  // Topics actually present in the library, for the home chip bar and sidebar.
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  // Lightweight ranking features, pulled by the recommendation service so it
  // can rank without ever reading this service's database.
  rpc ListVideoFeatures(ListVideoFeaturesRequest) returns (ListVideoFeaturesResponse);

  // Writes, called by the ingest worker as a video moves through the pipeline.
  rpc UpsertChannel(UpsertChannelRequest) returns (UpsertChannelResponse);
  rpc UpsertVideo(UpsertVideoRequest) returns (UpsertVideoResponse);
  rpc SetMediaState(SetMediaStateRequest) returns (SetMediaStateResponse);
  // Records whether a video is a Short. Ingest asks YouTube; catalog stores the
  // answer, because "is this a Short" is a property of the video the library
  // holds rather than of the fetch that found it.
  rpc SetShort(SetShortRequest) returns (SetShortResponse);
  // The videos nobody has asked about yet, newest first.
  rpc ListUncheckedShorts(ListUncheckedShortsRequest) returns (ListUncheckedShortsResponse);
  // Resolves an external source URL to an existing library entry, so the same
  // video is never ingested twice.
  rpc FindBySourceURL(FindBySourceURLRequest) returns (FindBySourceURLResponse);

  // Comments
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  // Batch import of YouTube comments. Idempotent: comments whose id already
  // exists are skipped with ON CONFLICT DO NOTHING.
  rpc ImportComments(ImportCommentsRequest) returns (ImportCommentsResponse);

  // Interaction state. Lives here rather than in a separate service because
  // almost every video read needs it; splitting it out would turn one call
  // into an N+1 fan-out on the home grid.
  rpc RecordWatchProgress(RecordWatchProgressRequest) returns (RecordWatchProgressResponse);
  rpc SetReaction(SetReactionRequest) returns (SetReactionResponse);
  rpc SetSubscription(SetSubscriptionRequest) returns (SetSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  // Watch Later. The table and the read have existed since 0001_init — every
  // video already reports user_state.in_watch_later — but nothing could ever
  // write it, so it answered false for everybody, forever.
  rpc ListWatchLater(ListWatchLaterRequest) returns (ListWatchLaterResponse);
  // The account importer's write. Watch later is a mirror of the member's
  // YouTube list, so this replaces it — see ImportWatchLaterRequest.complete.
  rpc ImportWatchLater(ImportWatchLaterRequest) returns (ImportWatchLaterResponse);

  // Playlists, per member. Watch Later is deliberately not one of these: it has
  // no name, cannot be created and cannot be deleted, so as a row here it would
  // be a playlist that is not one.
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);
  // The account importer's write. Appends, never removes: YouTube answering
  // with a short list must not empty a playlist here, the same rule the
  // subscription import follows.
  rpc ImportPlaylistItems(ImportPlaylistItemsRequest) returns (ImportPlaylistItemsResponse);
  // Imported playlists whose contents were read longest ago, never-synced
  // first. Bounded: reading a playlist is a request on a credentialed session.
  rpc ListStalePlaylists(ListStalePlaylistsRequest) returns (ListStalePlaylistsResponse);
  // Drops imported playlists the member no longer has upstream. The other half
  // of the mirror: without it a playlist deleted on YouTube stays here for ever,
  // and nothing in this app can remove it.
  rpc PruneImportedPlaylists(PruneImportedPlaylistsRequest) returns (PruneImportedPlaylistsResponse);

  // Storage. Backs the Storage page and the eviction banner.
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);
  rpc SetPinned(SetPinnedRequest) returns (SetPinnedResponse);
  // Videos the viewer has chosen to keep. "Saved" is the browsing view; pinning
  // is also the mechanism that protects a video from eviction.
  rpc ListPinnedVideos(ListPinnedVideosRequest) returns (ListPinnedVideosResponse);
}

// ---------------------------------------------------------------------------
// Entities
// ---------------------------------------------------------------------------

// State of the media file on disk. Metadata always survives; only bytes are
// reclaimed, so an EVICTED video still renders and can be re-ingested.
enum MediaState {
  MEDIA_STATE_UNSPECIFIED = 0;
  MEDIA_STATE_QUEUED = 1;
  MEDIA_STATE_DOWNLOADING = 2;
  MEDIA_STATE_READY = 3;
  MEDIA_STATE_EVICTED = 4;
  MEDIA_STATE_FAILED = 5;
  // Upstream will not hand this video over, and asking again will not change
  // that: members-only, private, or removed. Distinct from FAILED, which means
  // "the attempt did not work" and carries an offer to try again — an offer
  // that, made here, is how one members-only video collected thirteen jobs in
  // two minutes.
  MEDIA_STATE_UNAVAILABLE = 6;
}

enum Reaction {
  REACTION_UNSPECIFIED = 0;
  REACTION_NONE = 1;
  REACTION_LIKE = 2;
  REACTION_DISLIKE = 3;
}

message Channel {
  string id = 1;
  string name = 2;
  string handle = 3;
  // Path served by Caddy under /media, not an absolute URL, so the client
  // works under any LAN hostname or scheme.
  string avatar_path = 4;
  // Subscriber count as reported by the source platform at ingest time.
  int64 subscriber_count = 5;
  bool verified = 6;
  // Whether the requesting user follows this channel locally.
  bool subscribed = 7;
  // Wide header image, path under /media. Empty when the source had none.
  string banner_path = 8;
}

message Video {
  string id = 1;
  string title = 2;
  Channel channel = 3;
  int32 duration_seconds = 4;
  int64 view_count = 5;
  google.protobuf.Timestamp published_at = 6;
  // When the video entered the local library. Drives "recently added" and LRU.
  google.protobuf.Timestamp added_at = 7;
  string thumbnail_path = 8;
  string description = 9;
  repeated string hashtags = 10;
  // Topic names this video was discovered under, from topics.yaml. A video
  // found in two topics' sources carries both.
  repeated string topics = 11;
  MediaState media_state = 12;
  // Relative path of the playable file, empty unless media_state is READY.
  string media_path = 13;
  int64 size_bytes = 14;
  bool pinned = 15;
  // Original source URL, kept so an evicted video can be re-ingested.
  string source_url = 16;
  // Per-user state. Absent for anonymous reads.
  optional VideoUserState user_state = 17;
  // Aggregate across all local users, shown next to the like button.
  int64 like_count = 18;
  // Subtitle tracks on disk. Empty until the media file has been downloaded.
  repeated SubtitleTrack subtitles = 19;
  // Primary language of the video, e.g. "en", "vi". From yt-dlp on full fetch,
  // or detected from the title on flat listings. Empty when unknown.
  string language = 20;
  // How this video reached the library: SOURCE, RELATED or SEARCH.
  //
  // Empty for everything ingested before the field existed, and deliberately
  // not guessed at afterwards — the obvious proxy (expansion stored videos
  // unfiled) was wrong, because the metadata backfill later fills YouTube's own
  // category in for everything.
  string discovered_via = 22;
  // Whether this is a YouTube Short. Absent until it has been asked.
  //
  // Optional rather than a plain bool because "no" and "not yet asked" are
  // different answers and the difference decides whether the checker visits it.
  // Not derived from duration: a 14-second video measured as an ordinary clip
  // and a 40-second one measured as a Short.
  optional bool is_short = 21;
}

message SubtitleTrack {
  // BCP-47, e.g. "en", "vi".
  string language = 1;
  string label = 2;
  // Relative path under the media root, served as WebVTT.
  string path = 3;
  // Machine generated captions are noticeably worse; the UI says so.
  bool generated = 4;
}

message VideoUserState {
  // Watch position as a fraction in the 0..1 range.
  float watch_progress = 1;
  int32 watch_position_seconds = 2;
  google.protobuf.Timestamp last_watched_at = 3;
  Reaction reaction = 4;
  bool in_watch_later = 5;
}

message CommentAuthor {
  // Absent for imported YouTube comments (no local user).
  optional string user_id = 1;
  string handle = 2;
  string avatar_path = 3;
}

message Comment {
  string id = 1;
  string video_id = 2;
  CommentAuthor author = 3;
  string text = 4;
  google.protobuf.Timestamp published_at = 5;
  int64 like_count = 6;
  // Set when the comment is pinned; carries the handle that pinned it.
  optional string pinned_by = 7;
  // Only one level of nesting exists, matching the UI thread model.
  repeated Comment replies = 8;
  int32 reply_count = 9;
}

// ---------------------------------------------------------------------------
// Reads
// ---------------------------------------------------------------------------

message GetVideoRequest {
  string video_id = 1;
  // Optional: when set, user_state is populated.
  string user_id = 2;
}

message GetVideoResponse {
  Video video = 1;
}

message BatchGetVideosRequest {
  // Response order mirrors this list exactly.
  repeated string video_ids = 1;
  string user_id = 2;
}

message BatchGetVideosResponse {
  // Ids that no longer exist are omitted rather than returned as empty slots.
  repeated Video videos = 1;
}

message SearchVideosRequest {
  // Full-text query across title, description and transcript.
  string query = 1;
  string user_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message SearchVideosResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}

message SuggestRequest {
  string query = 1;
  int32 limit = 2;
}

message SuggestResponse {
  repeated Suggestion suggestions = 1;
}

message Suggestion {
  string text = 1;
  SuggestionKind kind = 2;
  // Number of videos behind this suggestion, for topics and channels.
  int32 video_count = 3;
}

enum SuggestionKind {
  SUGGESTION_KIND_UNSPECIFIED = 0;
  SUGGESTION_KIND_TITLE = 1;
  SUGGESTION_KIND_TOPIC = 2;
  SUGGESTION_KIND_CHANNEL = 3;
}

message ListChannelVideosRequest {
  string channel_id = 1;
  string user_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListChannelVideosResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}

message GetChannelRequest {
  string channel_id = 1;
  string user_id = 2;
}

message GetChannelResponse {
  Channel channel = 1;
  int32 video_count = 2;
}

message ListTopicsRequest {
  // Only topics with at least this many videos are returned, so the chip bar
  // never shows a filter that yields an empty grid.
  int32 min_video_count = 1;
}

message ListTopicsResponse {
  repeated Topic topics = 1;
}

message Topic {
  string name = 1;
  int32 video_count = 2;
}

message ListVideoFeaturesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListVideoFeaturesResponse {
  repeated VideoFeatures videos = 1;
  string next_page_token = 2;
}

// Just enough to rank a video. Deliberately excludes titles, descriptions and
// per-user state: the recommendation service has no business holding those.
message VideoFeatures {
  string video_id = 1;
  string channel_id = 2;
  repeated string topics = 3;
  repeated string hashtags = 4;
  google.protobuf.Timestamp published_at = 5;
  google.protobuf.Timestamp added_at = 6;
  int32 duration_seconds = 7;
  MediaState media_state = 8;
  string language = 9;
  int64 view_count = 10;
  // True only where it has been confirmed. Ranking treats unknown as "not a
  // Short", so a video is never withheld from the feed over a question the
  // checker has not reached yet.
  bool is_short = 11;
  // How this video reached the library. Empty where it is not known.
  string discovered_via = 12;
}

// ---------------------------------------------------------------------------
// Writes
// ---------------------------------------------------------------------------

message UpsertChannelRequest {
  Channel channel = 1;
}

message UpsertChannelResponse {
  Channel channel = 1;
}

message UpsertVideoRequest {
  // Video.id is the external id (the YouTube watch id), which makes ingest
  // idempotent: re-submitting the same URL updates rather than duplicates.
  Video video = 1;
}

message UpsertVideoResponse {
  Video video = 1;
}

message SetShortRequest {
  string video_id = 1;
  bool is_short = 2;
}

message SetShortResponse {}

message ListUncheckedShortsRequest {
  // Zero means the server's own bound rather than "all of them" — the same rule
  // the metadata backfill follows, and for the same reason.
  int32 limit = 1;
}

message ListUncheckedShortsResponse {
  repeated string video_ids = 1;
}

message SetMediaStateRequest {
  string video_id = 1;
  MediaState media_state = 2;
  // Set when transitioning to READY.
  string media_path = 3;
  int64 size_bytes = 4;
  // Set when transitioning to FAILED.
  string error_message = 5;
  // Replaces the stored set when transitioning to READY.
  repeated SubtitleTrack subtitles = 6;
}

message SetMediaStateResponse {}

message FindBySourceURLRequest {
  string source_url = 1;
}

message FindBySourceURLResponse {
  // Absent when the URL has never been ingested.
  optional Video video = 1;
}

// ---------------------------------------------------------------------------
// Comments
// ---------------------------------------------------------------------------

enum CommentSort {
  COMMENT_SORT_UNSPECIFIED = 0;
  COMMENT_SORT_TOP = 1;
  COMMENT_SORT_NEWEST = 2;
}

message ListCommentsRequest {
  string video_id = 1;
  CommentSort sort = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  // Includes replies, matching the "N Comments" heading in the UI.
  int32 total_count = 2;
  string next_page_token = 3;
}

message CreateCommentRequest {
  string video_id = 1;
  string user_id = 2;
  string text = 3;
  // Set to reply to an existing top-level comment.
  optional string parent_comment_id = 4;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message ImportComment {
  string id = 1;
  // Empty for top-level comments.
  string parent_id = 2;
  string author_handle = 3;
  string text = 4;
  int64 published_at_unix = 6;
  int64 like_count = 7;
  optional string pinned_by = 8;
}

message ImportCommentsRequest {
  string video_id = 1;
  repeated ImportComment comments = 2;
}

message ImportCommentsResponse {
  int32 imported = 1;
}

// ---------------------------------------------------------------------------
// Interaction
// ---------------------------------------------------------------------------

message RecordWatchProgressRequest {
  string user_id = 1;
  string video_id = 2;
  int32 position_seconds = 3;
  // Fraction of the video watched in this session, used by recsys as the
  // strongest engagement signal.
  float watched_fraction = 4;
}

message RecordWatchProgressResponse {}

message SetReactionRequest {
  string user_id = 1;
  string video_id = 2;
  Reaction reaction = 3;
}

message SetReactionResponse {
  int64 like_count = 1;
}

message SetSubscriptionRequest {
  string user_id = 1;
  string channel_id = 2;
  bool subscribed = 3;
}

message SetSubscriptionResponse {}

message ListSubscriptionsRequest {
  string user_id = 1;
  // Every member's channels, deduplicated, ignoring user_id.
  //
  // For the scanner, which follows subscribed channels as a content source: a
  // channel is worth scanning because *somebody* follows it, and reading one
  // member's list left the other members' channels unscanned. A separate flag
  // rather than an empty user_id, which is refused — the guard is what stops a
  // browser being handed the whole household's subscriptions by omission.
  bool all_members = 2;
}

message ListSubscriptionsResponse {
  repeated Channel channels = 1;
}

message ListHistoryRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListHistoryResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------------

message GetStorageUsageRequest {}

message GetStorageUsageResponse {
  int64 used_bytes = 1;
  // Configured ceiling, not the physical disk size.
  int64 budget_bytes = 2;
  int64 disk_free_bytes = 3;
  int32 video_count = 4;
  int32 evicted_count = 5;
  // Videos closest to being evicted, least recently accessed first.
  repeated Video eviction_candidates = 6;
  // Downloaded videos at least one member has saved, and so the sweep may not
  // delete. Household-wide on purpose: Storage is where somebody asks why the
  // disk is full, and "because people are keeping things" is the answer they
  // are looking for. The Save button itself stays personal.
  int32 kept_count = 7;
}

message SetPinnedRequest {
  string video_id = 1;
  // Pinned videos are never evicted, regardless of access time.
  bool pinned = 2;
  // Whose shelf. Saving is personal — the Saved page is one member's — while
  // the protection from eviction it grants is not: one disk, one budget, so a
  // video stays pinned while anybody has it saved.
  string user_id = 3;
}

message SetPinnedResponse {}

message Playlist {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 item_count = 4;
  // The YouTube playlist this was imported from. Empty when it was made here.
  string source_url = 5;
  google.protobuf.Timestamp updated_at = 6;
  // First few thumbnails, for the card on the playlists page. Sent with the
  // list so the page is one call rather than one call per playlist.
  repeated string thumbnail_paths = 7;
  // Whether this playlist's contents have been read yet.
  //
  // They are read a few playlists per account scan, so a freshly imported one
  // is empty for a while — and an empty playlist looks broken rather than
  // pending. The page says which it is.
  bool items_synced = 8;
}

message ListPlaylistsRequest {
  string user_id = 1;
}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
}

message GetPlaylistRequest {
  string playlist_id = 1;
  string user_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetPlaylistResponse {
  Playlist playlist = 1;
  repeated Video videos = 2;
  string next_page_token = 3;
}

message CreatePlaylistRequest {
  string user_id = 1;
  string title = 2;
  string description = 3;
  // Set by the account importer only. Idempotent on (user_id, source_url), so
  // an hourly re-import updates the same playlist rather than making another.
  // The gateway never sends it: a playlist made here belongs to nobody upstream.
  string source_url = 4;
}

message CreatePlaylistResponse {
  Playlist playlist = 1;
}

message ImportPlaylistItemsRequest {
  string playlist_id = 1;
  string user_id = 2;
  // In the order YouTube returned them.
  repeated string video_ids = 3;
  // Whether this is the whole playlist rather than the first page of it.
  //
  // The read is bounded, so a long playlist comes back truncated. Mirroring a
  // truncated read would delete everything past the cap — so a complete read
  // replaces the contents, and a truncated one only adds. The caller knows
  // which it got; catalog cannot tell.
  bool complete = 4;
}

message ImportPlaylistItemsResponse {
  int32 added = 1;
}

message PruneImportedPlaylistsRequest {
  string user_id = 1;
  // The source URLs the member still has. Empty is refused rather than obeyed:
  // a list that answers with nothing is far likelier to be a refusal than an
  // account with no playlists left.
  repeated string keep_source_urls = 2;
}

message PruneImportedPlaylistsResponse {
  int32 removed = 1;
}

message ListStalePlaylistsRequest {
  int32 limit = 1;
}

message ListStalePlaylistsResponse {
  // Carries user_id, which ListPlaylists' Playlist does not: the importer is
  // acting for a member rather than answering one.
  repeated StalePlaylist playlists = 1;
}

message StalePlaylist {
  string id = 1;
  string user_id = 2;
  string source_url = 3;
}

message ImportWatchLaterRequest {
  string user_id = 1;
  repeated string video_ids = 2;
  // As above: a complete read replaces the list, a truncated one only adds.
  bool complete = 3;
}

message ImportWatchLaterResponse {}

message ListWatchLaterRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListWatchLaterResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}

message ListPinnedVideosRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPinnedVideosResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}
