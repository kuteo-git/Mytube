syntax = "proto3";

package ingest.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucnguyen/local-youtube/gen/go/ingest/v1;ingestv1";

// The ingest service is the only component that talks to the outside world.
//
// It implements the hybrid playback model: a freshly requested video is
// playable almost immediately through a resolved upstream stream, while a
// background job downloads a local copy. Once the copy lands, playback moves to
// disk and the upstream is never touched again for that video.
service IngestService {
  // Searches upstream. Topics decide what the feed offers; search is how the
  // user goes looking for something the topics were never going to surface.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Creates the catalog row for a video found by search, so it can be opened
  // like any other. No media is fetched: pressing play does that.
  rpc EnsureVideo(EnsureVideoRequest) returns (EnsureVideoResponse);

  // Reads one video's metadata upstream, writing nothing.
  //
  // Pasting a link into search points at exactly one video, so searching for
  // the text of its address is the wrong verb — it spends a counted upstream
  // request (see the note on Search) hunting for something already located.
  // This fetches that one video instead.
  //
  // It writes nothing on purpose: a pasted link and a search result are the
  // same act — "I saw this video elsewhere" — and a search result is written
  // only when it is opened. Two rules for one act is how they come to disagree.
  rpc PreviewVideo(PreviewVideoRequest) returns (PreviewVideoResponse);

  // Rescans topics.yaml now instead of waiting for the timer.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Assigns YouTube's own category to videos that have none.
  //
  // Scans use flat listings, which carry no category, so everything they bring
  // in arrives without a topic and stays invisible to topic filters. Fetching
  // categories during a scan was tried and measured, and made scanning
  // unusable; this is the same work as a separate pass that runs when asked.
  // Returns as soon as the pass has started. Finishing takes hours — YouTube
  // throttles sustained metadata fetches — so progress is polled through
  // GetBackfillStatus rather than awaited.
  rpc BackfillTopics(BackfillTopicsRequest) returns (BackfillTopicsResponse);
  rpc GetBackfillStatus(GetBackfillStatusRequest) returns (GetBackfillStatusResponse);
  rpc GetScanStatus(GetScanStatusRequest) returns (GetScanStatusResponse);

  // Resolves a directly playable upstream URL. This is what makes "click and
  // watch" feel instant; the URL is short-lived and must not be persisted.
  rpc ResolveStream(ResolveStreamRequest) returns (ResolveStreamResponse);

  // Queues a download. Returns immediately; progress is polled through GetJob.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // Takes a finished job off the Activity page. Terminal states only: a job
  // still running is cancelled, not hidden.
  rpc DismissJob(DismissJobRequest) returns (DismissJobResponse);
  // Dismisses every job with a given state, so the Activity page can be emptied
  // in one action rather than one row at a time.
  rpc DismissJobs(DismissJobsRequest) returns (DismissJobsResponse);
  // Queues the same URL again. Most failures here are temporary — a rate limit,
  // a block that has lifted, a network that dropped — so trying again is worth
  // an action of its own rather than leaving "hide it" as the only one.
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  // What the scanner has been doing, newest first. Distinct from GetScanStatus,
  // which reports only the pass that has just run.
  rpc ListScans(ListScansRequest) returns (ListScansResponse);
  // Deletes every scan row, so the Scand page clears in one action.
  rpc ClearScans(ClearScansRequest) returns (ClearScansResponse);
  // Stops whatever transfer is running for a video. Called when a viewer leaves
  // the watch page: a copy nobody is waiting for is a request to YouTube nobody
  // is waiting for either, and too many of those get the address blocked.
  rpc CancelVideoDownload(CancelVideoDownloadRequest) returns (CancelVideoDownloadResponse);

  // Brings new material into the library when the feed is running low. Metadata
  // only: nothing is downloaded until someone presses play.
  rpc ExpandLibrary(ExpandLibraryRequest) returns (ExpandLibraryResponse);

  // A household member's own YouTube session.
  //
  // Write-only by design: there is no RPC that returns cookie content, because
  // a cookies.txt is a live Google session and the only thing that should ever
  // hold it is the yt-dlp command line being built for it.
  rpc SetAccountCookies(SetAccountCookiesRequest) returns (SetAccountCookiesResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);
  rpc ScanAccounts(ScanAccountsRequest) returns (ScanAccountsResponse);
  // What the pass in flight is doing. Polled by the settings screen, which is
  // how progress survives a page reload.
  rpc GetAccountScanStatus(GetAccountScanStatusRequest) returns (GetAccountScanStatusResponse);

  // Lists a channel's uploads straight from YouTube, paginated. The channel
  // page uses this rather than the local catalog so browsing a channel is not
  // limited to whatever a scan happened to bring in.
  rpc ListChannelUploads(ListChannelUploadsRequest) returns (ListChannelUploadsResponse);

  // Who a channel address names, for a channel the library has never seen.
  //
  // A pasted channel link carries a handle far more often than an id, and a
  // handle is not a key: the catalog is keyed by the `UC…` id, so a channel
  // nobody here follows cannot be looked up, written down or opened without
  // asking upstream once. This is that one ask.
  //
  // Only reached when the catalog has no such handle — 1626 of this library's
  // 1690 channels carry one, so most pasted links never come here at all.
  rpc ResolveChannel(ResolveChannelRequest) returns (ResolveChannelResponse);

  // Fetches comments for a video from YouTube via yt-dlp. Returns every comment
  // in one call — yt-dlp's --write-comments has no pagination — so the gateway
  // batches them into catalog and the frontend paginates from there.
  rpc FetchComments(FetchCommentsRequest) returns (FetchCommentsResponse);
}

message ListChannelUploadsRequest {
  // Channel handle ("@mkbhd") or bare channel id ("UC...").
  string channel = 1;
  // Opaque. Empty starts at the channel's default ordering; otherwise it is
  // either a sort option's token or the previous page's next_page_token.
  string page_token = 2;
}

// SortOption is one of the orderings YouTube offers for a channel, carrying the
// token that selects it. The list is whatever YouTube returned rather than a
// fixed set, so a channel offering fewer of them cannot produce a dead control.
message SortOption {
  string label = 1;
  string token = 2;
}

message ListChannelUploadsResponse {
  repeated ExternalVideo videos = 1;
  repeated SortOption sort_options = 2;
  string next_page_token = 3;
  // The channel's picture, taken from the same response rather than fetched.
  // Empty when the listing fell back to a flat playlist, which has no header.
  string avatar_url = 4;
}

message ResolveChannelRequest {
  // A handle ("@mkbhd"), a bare channel id, or a full channel address.
  string channel = 1;
}

message ResolveChannelResponse {
  string channel_id = 1;
  string name = 2;
  string handle = 3;
  string avatar_url = 4;
  int64 subscriber_count = 5;
}

message SetAccountCookiesRequest {
  string user_id = 1;
  string label = 2;
  // Netscape cookies.txt, as exported by a browser extension. Validated before
  // anything is written; an invalid paste stores nothing.
  string cookies = 3;
}

message SetAccountCookiesResponse {}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

// Metadata about a stored session. Never the session.
message Account {
  string user_id = 1;
  string label = 2;
  google.protobuf.Timestamp added_at = 3;
  google.protobuf.Timestamp last_scan_at = 4;
  // A short sentence for the settings screen. Holds nothing read out of the
  // cookie file.
  string last_result = 5;
  // OK, EXPIRED or NEVER_SET.
  string state = 6;
}

message RemoveAccountRequest {
  string user_id = 1;
}

message RemoveAccountResponse {}

message ScanAccountsRequest {
  // Whose account to scan. Empty means the whole household, which is what the
  // hourly timer does; the Scan now button sends whoever pressed it, because
  // that button sits on a screen about *your* account.
  string user_id = 1;
}

message GetAccountScanStatusRequest {}

message GetAccountScanStatusResponse {
  AccountScanStatus status = 1;
}

// What the account pass in flight is doing.
//
// A first fill reads every playlist a member has and takes minutes, so the pass
// outlives the request that started it. The browser holds nothing: it asks for
// this, which is what makes a page reload mid-pass harmless.
message AccountScanStatus {
  bool running = 1;
  google.protobuf.Timestamp started_at = 2;
  int64 duration_ms = 3;
  // In words meant for a settings screen. Never carries account details.
  string phase = 4;
  int32 playlists_read = 5;
  int32 playlists_total = 6;
  int32 accounts = 7;
  int32 subscriptions = 8;
  int32 playlists = 9;
  int32 videos = 10;
  int32 playlist_videos = 11;
  int32 expired = 12;
  // Bounded: a pass that fails on a hundred playlists must not grow a
  // hundred-line message. The log has all of them.
  repeated string errors = 13;
}

message ScanAccountsResponse {
  int32 accounts = 1;
  int32 subscriptions = 2;
  int32 videos = 3;
  int32 expired = 4;
  // Playlists named this pass — all of them — and the videos contributed by the
  // few whose contents were read. The two differ on purpose: naming is one
  // request, reading is one request each.
  int32 playlists = 5;
  int32 playlist_videos = 6;
}

message ExpandLibraryRequest {
  // Empty means "any topic".
  string topic = 1;
  // Videos to look beside, normally the most recently watched.
  repeated string seed_video_ids = 2;
}

message ExpandLibraryResponse {
  int32 videos_added = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

// A video discovered upstream but not necessarily present locally. Produced by
// the scanner; the RPC surface no longer returns these directly.
message ExternalVideo {
  // The upstream id, reused as the local video id so ingest is idempotent.
  string id = 1;
  string title = 2;
  string channel_id = 3;
  string channel_name = 4;
  int32 duration_seconds = 5;
  int64 view_count = 6;
  string thumbnail_url = 7;
  string source_url = 8;
  google.protobuf.Timestamp published_at = 9;
  string description = 10;
  // Topic names assigned by the scanner, not YouTube's own categories.
  repeated string topics = 11;
  repeated string hashtags = 12;
  // True when this id already exists in the local library.
  bool in_library = 13;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchResponse {
  repeated ExternalVideo videos = 1;
}

message PreviewVideoRequest {
  string url = 1;
}

message PreviewVideoResponse {
  ExternalVideo video = 1;
}

message EnsureVideoRequest {
  string url = 1;
}

message EnsureVideoResponse {
  // Catalog id of the video, ready to be opened.
  string video_id = 1;
}

message BackfillTopicsRequest {
  // Most videos to process in this pass. **Zero means the default of 200**, not
  // "all" — every pass is bounded, because each video costs a full metadata
  // fetch and this library has already been blocked once for making too many.
  //
  // The pass selects on "still missing the data", so a bounded run is resumable
  // simply by running it again, and the scheduled pass does exactly that.
  int32 limit = 1;
}

message GetBackfillStatusRequest {}

// BackfillStatus is the progress of a topic backfill pass, whether it is still
// running or has finished.
message BackfillStatus {
  // Total the pass set out to process. Zero before one has started.
  int32 examined = 1;
  int32 updated = 2;
  // Videos whose metadata could not be fetched: private, removed or
  // region-blocked. Reported rather than retried — asking again will not make
  // them fetchable.
  int32 failed = 3;
  bool running = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message BackfillTopicsResponse {
  BackfillStatus status = 1;
}

message GetBackfillStatusResponse {
  BackfillStatus status = 1;
}

message RefreshRequest {}

message RefreshResponse {
  ScanStatus status = 1;
}

message GetScanStatusRequest {}

message GetScanStatusResponse {
  ScanStatus status = 1;
}

// Reports the most recent scan, so the UI can show when the library last
// changed and whether any source is broken.
message ScanStatus {
  google.protobuf.Timestamp started_at = 1;
  int64 duration_ms = 2;
  int32 sources_scanned = 3;
  int32 sources_failed = 4;
  int32 videos_seen = 5;
  int32 videos_added = 6;
  repeated string errors = 7;
  bool running = 8;
}

message ResolveStreamRequest {
  string video_id = 1;
  // Discards any cached URL for this video and asks upstream again.
  //
  // A signed URL is occasionally handed over already dead: it redirects, and
  // the host it redirects to answers 403 every single time, for as long as the
  // URL lives. Resolving again almost always yields a working one, so the
  // caller that met the refusal is the only party that can tell the cache its
  // entry is worthless — nothing about the URL itself says so.
  bool refresh = 2;
}

message ResolveStreamResponse {
  // Directly playable by a <video> element. Only progressive formats are
  // returned, because adaptive streams need MSE and a manifest the browser
  // cannot consume from a bare URL.
  string url = 1;
  int32 height = 2;
  // Upstream URLs expire. The client must re-resolve rather than cache.
  google.protobuf.Timestamp expires_at = 3;
  string mime_type = 4;
}

message SubmitRequest {
  string url = 1;
  string requested_by = 2;
  // Height to download, e.g. 1080. Zero means the configured default.
  int32 preferred_height = 3;
}

message SubmitResponse {
  Job job = 1;
}

message Job {
  string id = 1;
  string source_url = 2;
  // Populated once metadata resolution succeeds.
  string video_id = 3;
  string title = 4;
  JobState state = 5;
  // 0..1, reported by the downloader.
  float progress = 6;
  int64 downloaded_bytes = 7;
  int64 total_bytes = 8;
  string error_message = 9;
  int32 attempts = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp finished_at = 12;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  // When true, only jobs that are queued or running.
  bool active_only = 1;
  int32 limit = 2;
  // When true, jobs somebody has cleared off the Activity page are left out.
  //
  // Asked for rather than assumed, because two callers read this list for
  // different reasons: the Activity page is being tidied, while the player is
  // watching for its own download to land and must see every job there is.
  bool hide_dismissed = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {}

message DismissJobRequest {
  string job_id = 1;
}

message DismissJobResponse {}

message DismissJobsRequest {
  // Job state to dismiss: "FAILED" or "SUCCEEDED".
  string state = 1;
}

message DismissJobsResponse {
  int64 dismissed = 1;
}

message RetryJobRequest {
  string job_id = 1;
  string requested_by = 2;
}

message RetryJobResponse {
  // The new job. The old one keeps its record of what went wrong.
  Job job = 1;
}

message ListScansRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListScansResponse {
  repeated ScanStatus scans = 1;
  // How many passes are on record, so the page knows whether to offer more.
  int32 total = 2;
}

message ClearScansRequest {}

message ClearScansResponse {}

message CancelVideoDownloadRequest {
  string video_id = 1;
}

message CancelVideoDownloadResponse {
  // How many transfers were stopped. Zero is the ordinary case and not an error.
  int32 cancelled = 1;
}

// A single YouTube comment as returned by yt-dlp's --write-comments.
message YouTubeComment {
  string id = 1;
  // Empty for top-level comments; set for replies.
  string parent_id = 2;
  string author = 3;
  string author_id = 4;
  string text = 5;
  // Unix epoch seconds. yt-dlp returns timestamp as an integer, not an RFC 3339
  // string, so a google.protobuf.Timestamp would lose precision on parse.
  int64 published_at_unix = 6;
  int64 like_count = 7;
  // Set when the comment is pinned; carries the handle that pinned it.
  optional string pinned_by = 8;
}

message FetchCommentsRequest {
  string video_id = 1;
}

message FetchCommentsResponse {
  repeated YouTubeComment comments = 1;
}
