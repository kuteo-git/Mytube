syntax = "proto3";

package recsys.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucnguyen/local-youtube/services/recsys/gen/recsys/v1;recsysv1";

// The recommendation service owns ranking and nothing else. It never returns
// video metadata: it returns ordered ids plus the reason each id was chosen,
// and the gateway hydrates them through catalog.BatchGetVideos.
//
// Phase 1 ranking is heuristic, not learned — with a library of a few hundred
// self-imported videos and a handful of users there is not enough signal for a
// model to beat explicit rules, and rules stay debuggable.
service RecommendationService {
  // Ranked ids for the home grid.
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
  // Ranked ids for the watch page "Next" rail.
  rpc GetUpNext(GetUpNextRequest) returns (GetUpNextResponse);
  // New uploads from followed channels that this viewer has not watched.
  //
  // Separate from GetFeed because it answers a different question. That one
  // asks "what should this household see", and its fresh-subscribed slot holds
  // a tenth of a page — enough that something new usually appears, and not a
  // list anybody can read to the end. This asks "did I miss anything", which
  // has an answer that runs out, and running out is the point of it.
  rpc GetMissed(GetMissedRequest) returns (GetMissedResponse);

  // The videos this user has spent the most time on. Watch signals accumulate
  // during playback, so this measures time watched, not times opened.
  rpc GetMostWatched(GetMostWatchedRequest) returns (GetMostWatchedResponse);
  // Behaviour signals, written on every meaningful interaction so the next
  // feed request already reflects them. No batch job in the loop.
  rpc RecordSignal(RecordSignalRequest) returns (RecordSignalResponse);
  // Suppresses items already shown, so the grid does not repeat itself.
  rpc RecordImpressions(RecordImpressionsRequest) returns (RecordImpressionsResponse);

  // Forget a member entirely: their signals and what they were shown.
  //
  // The first delete this service has ever had. Without it a removed profile
  // leaves its whole history behind — `u_luc` alone holds 63,908 signals — and
  // §3's rule that no service reads another's database means the gateway
  // cannot reach in and tidy up on its way past.
  rpc DeleteUserData(DeleteUserDataRequest) returns (DeleteUserDataResponse);

  // The same ranking with its working shown, for tuning and for answering
  // "why is this video here" and "where did that one go".
  //
  // A debug surface with no UI behind it, and deliberately so. Every constant
  // in the ranker has been set by looking at a page and forming an impression,
  // and an impression cannot tell "this weight is wrong" from "this weight is
  // right and something downstream is discarding it" — which is precisely the
  // distinction that was missed when the quota shuffled each bucket uniformly
  // and made the entire score decorative.
  rpc ExplainFeed(ExplainFeedRequest) returns (ExplainFeedResponse);
}

// Why a video was surfaced. Sent to the client for debugging and to let the UI
// group results later without recomputing anything.
enum RecommendationReason {
  RECOMMENDATION_REASON_UNSPECIFIED = 0;
  RECOMMENDATION_REASON_CONTINUE_WATCHING = 1;
  RECOMMENDATION_REASON_RECENTLY_ADDED = 2;
  RECOMMENDATION_REASON_NEVER_WATCHED = 3;
  RECOMMENDATION_REASON_SUBSCRIBED_CHANNEL = 4;
  RECOMMENDATION_REASON_REWATCH = 5;
  RECOMMENDATION_REASON_SAME_CHANNEL = 6;
  RECOMMENDATION_REASON_SHARED_TAGS = 7;
  // Opened and abandoned within the first moments. Distinct from never having
  // been watched: the viewer has already answered, and the answer was no.
  RECOMMENDATION_REASON_BOUNCED = 8;
  // Outside the viewer's affinity — unwatched channel, unfamiliar topic.
  // Reserved a small quota to prevent the feed converging on the familiar.
  RECOMMENDATION_REASON_DISCOVERY = 9;
}

message RankedVideo {
  string video_id = 1;
  float score = 2;
  RecommendationReason reason = 3;
}

// How much of the feed each source of new material is entitled to.
//
// Sent with the request rather than stored here, so this service keeps no
// configuration of its own: the setting belongs to whoever is asking, and the
// ranking is a pure function of the request and the signals.
//
// The three are percentages of the room left once continue-watching and
// rewatching have taken their fixed share, and they are normalised on arrival —
// a caller that sends 3/2/1 gets the same feed as one that sends 50/33/17.
// All three zero means "unset", and the defaults apply.
message FeedMix {
  // Channels the viewer subscribed to.
  int32 subscribed_percent = 1;
  // Not subscribed, but matching what this viewer watches.
  int32 affinity_percent = 2;
  // Not subscribed and outside their affinity — the window kept open so the
  // feed does not converge on the familiar.
  int32 discovery_percent = 3;
}

message GetFeedRequest {
  string user_id = 1;
  // Chip filter selected in the UI. Empty means no filter.
  string category = 2;
  int32 page_size = 3;
  string page_token = 4;
  // Local wall-clock hour at the client, 0-23. Time of day is one of the
  // behaviour signals the brief called for.
  int32 client_hour = 5;
  // Optional. Absent means the built-in mix.
  FeedMix mix = 6;
  // Language codes the viewer wants to see, e.g. ["en", "vi"].
  // Empty means no filter — show all languages.
  repeated string languages = 7;
  // Optional. Absent means the built-in ranking constants.
  RankingTuning tuning = 8;
}

message GetFeedResponse {
  repeated RankedVideo videos = 1;
  string next_page_token = 2;
  // How many ranked videos are left after this page. The gateway uses it to
  // decide when to go looking for more material, before the viewer hits the end.
  int32 remaining_count = 3;
}

message GetMissedRequest {
  string user_id = 1;
  // How far back to look. Zero means the server's own default.
  int32 within_hours = 2;
  int32 page_size = 3;
  string page_token = 4;
  // Language codes the viewer wants to see. Empty means no filter.
  repeated string languages = 5;
}

message GetMissedResponse {
  repeated RankedVideo videos = 1;
  string next_page_token = 2;
  // How many are left after this page.
  int32 remaining_count = 3;
}

message GetMostWatchedRequest {
  string user_id = 1;
  int32 limit = 2;
}

message GetMostWatchedResponse {
  repeated RankedVideo videos = 1;
}

message GetUpNextRequest {
  string user_id = 1;
  string current_video_id = 2;
  // Empty means no filter; otherwise restrict to this channel.
  string channel_filter = 3;
  int32 page_size = 4;
  // Offset into the ranked list. 0 for the first page.
  int32 page_token = 5;
}

message GetUpNextResponse {
  repeated RankedVideo videos = 1;
  // Set when more pages exist; pass as page_token in the next request.
  int32 next_page_token = 2;
}

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  SIGNAL_TYPE_WATCH = 1;
  SIGNAL_TYPE_LIKE = 2;
  SIGNAL_TYPE_DISLIKE = 3;
  SIGNAL_TYPE_SUBSCRIBE = 4;
  SIGNAL_TYPE_UNSUBSCRIBE = 5;
  SIGNAL_TYPE_SEARCH = 6;
  SIGNAL_TYPE_SKIP = 7;
}

message RecordSignalRequest {
  string user_id = 1;
  SignalType type = 2;
  // Set for every type except SEARCH.
  string video_id = 3;
  // Set for SEARCH.
  string query = 4;
  // Set for WATCH: fraction of the video watched, 0..1.
  float watched_fraction = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message RecordSignalResponse {}

message RecordImpressionsRequest {
  string user_id = 1;
  repeated string video_ids = 2;
}

message RecordImpressionsResponse {}

message DeleteUserDataRequest {
  string user_id = 1;
  bool dry_run = 2;
}

message DeleteUserDataResponse {
  int64 signals = 1;
  int64 impressions = 2;
}

message ExplainFeedRequest {
  string user_id = 1;
  // Same filters the feed itself takes, so the explanation describes the page
  // the viewer is actually looking at.
  string category = 2;
  FeedMix mix = 3;
  repeated string languages = 4;
  RankingTuning tuning = 5;
}

// One video's score with its working shown.
//
// The components are a map rather than a field per term. They are read by a
// person, they change whenever the ranker is tuned, and giving each one a field
// number would mean a proto edit and a regeneration every time somebody tries a
// different weight — which is the thing this message exists to make cheap.
message VideoExplanation {
  string video_id = 1;
  // Empty when the video is in the feed; otherwise why it is not, in words.
  // Every other field is meaningless when this is set.
  string excluded_reason = 2;
  // Named contributions, in the units they are applied in: additive terms are
  // points, multipliers are factors.
  map<string, double> components = 3;
  double score = 4;
  RecommendationReason reason = 5;
  // Which share of the page it competes for, as a name.
  string slot = 6;
  // Its position in the feed as served, or -1 when it is not in the feed. Not
  // derivable from the score: the quota and the per-channel cap both reorder.
  int32 position = 7;
}

message ExplainFeedResponse {
  // Videos in the feed first, in the order they would be served, then the ones
  // that were excluded.
  repeated VideoExplanation videos = 1;
}

// Ranking constants the household can move without a rebuild.
//
// Every field is optional, and absent means "use the built-in value". Zero is a
// real setting for several of these — a session blend of zero says "ignore what
// I am watching right now" — so presence and zero must be distinguishable, which
// is the whole reason for the optional keyword here.
//
// Sent with the request like FeedMix, and for the same reason: recsys keeps no
// configuration of its own (CLAUDE.md §3). The file lives at the gateway, where
// it can be edited by hand.
//
// Deliberately not every weight in the ranker. These are the settings that
// answer a question somebody actually has; the two dozen score weights answer
// questions nobody asks, and exposing them would trade the one thing this
// heuristic has over a model — that every number can be explained — for knobs.
message RankingTuning {
  // How much of the affinity multiplier is decided by the current sitting
  // rather than the whole watch history. 0 = ignore the sitting, 1 = ignore
  // the history.
  optional double session_blend = 1;
  // Share of the page reserved for new uploads from followed channels.
  optional int32 fresh_subscribed_percent = 2;
  // How long a video counts as new, in hours.
  optional int32 freshness_window_hours = 3;
  // Videos published longer ago than this never reach the home page.
  optional int32 max_published_age_days = 4;
  // How fast the "recently added to the library" boost decays.
  optional double recency_half_life_days = 5;
  // How sharply the feed's ordering follows the score. Lower is stricter.
  optional double softmax_temperature = 6;
  // How many of each bucket's best are entered into the draw. Raising it past
  // a few hundred is what let low-scoring videos onto the first page.
  optional int32 sample_pool_size = 7;
}
