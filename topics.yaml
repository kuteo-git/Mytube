# The curated content source. Almost everything here came from this file.
#
# To change what the feed can show you, edit this file. That is deliberate — it
# keeps the library something you curate rather than something you accumulate by
# browsing.
#
# One other door exists and it is deliberately narrow. When the feed runs low,
# `ExpandLibrary` reads further down these same sources and, failing that, pulls
# related videos for things already in the library — at most three per channel
# per pass. It used to also search YouTube for the name of whatever topic chip
# you were looking at and store the results, which is how this file's opening
# line stopped being true: 708 channels in the library against 87 subscribed and
# the 6 sources below, with a third of Home coming from channels nobody chose.
# That layer is gone.
#
# A source is a YouTube playlist or channel URL. Scanning uses --flat-playlist,
# which fetches listing metadata only: no media is downloaded until you press
# play on something.
#
# A video that appears under two topics carries both.

topics:
  - name: Tech
    sources:
      - https://www.youtube.com/@LinusTechTips/videos
      - https://www.youtube.com/@mkbhd/videos
      # Tinh tế. The @handle does not resolve, so the channel id is used.
      - https://www.youtube.com/channel/UCyQobySFx_h9oFwsBV0KGdg/videos

  - name: Gaming
    sources:
      - https://www.youtube.com/@IGN/videos

  - name: Music
    sources: []

  - name: Vietnamese music
    sources:
      - https://www.youtube.com/@SOOBINofficial/videos

  - name: AI
    sources:
      - https://www.youtube.com/@TwoMinutePapers/videos

# How many videos to take from each source per scan. Sources are usually
# ordered newest first, so this is effectively "the most recent N".
per_source_limit: 40
