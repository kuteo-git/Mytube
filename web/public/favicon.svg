<!-- The same mark the top bar draws, so the tab and the page agree.

     What was here before was the purple bolt left over from the Vite template —
     it named a build tool rather than this library.

     The mark is inset rather than filling the box: a favicon is read at 16px
     beside a dozen others, and a shape running to the edge has nothing to
     separate it from its neighbours. The triangle is the only detail that
     survives at that size, so it is drawn large and centred on the optical
     centre, which sits right of the geometric one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="1" y="5" width="30" height="22" rx="6.5" fill="#ff0000" />
  <path d="M13 10.4 22 16l-9 5.6z" fill="#fff" />
</svg>
